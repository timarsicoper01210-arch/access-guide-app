<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Access Guide</title>
<meta name="description" content="Application d'aide au déplacement pour personnes malvoyantes ou handicapées : navigation guidée, détection d'obstacles, description de l'environnement." />
<link rel="manifest" href="manifest.webmanifest" />
<meta name="theme-color" content="#1d4ed8" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap');

  :root {
    --accent: #1d4ed8;
    --accent-hover: #1640b0;
    --accent-ink: #ffffff;
    --bg: #f7f8fb;
    --surface: #ffffff;
    --text: #14171f;
    --text-muted: #565b6b;
    --border: #e2e4ea;
    --danger: #b3261e;
    --danger-bg: #fdecea;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  }

  #app { min-height: 100%; display: flex; flex-direction: column; }

  .screen {
    flex: 1;
    display: none;
    flex-direction: column;
    padding: 20px;
    padding-bottom: max(20px, env(safe-area-inset-bottom));
    padding-top: max(20px, env(safe-area-inset-top));
    gap: 16px;
  }
  .screen.active { display: flex; }

  /* Home */
  #screen-home { justify-content: center; gap: 16px; }
  .mode-btn {
    display: block;
    width: 100%;
    padding: 32px 20px;
    border: none;
    border-radius: 18px;
    background: var(--accent);
    color: var(--accent-ink);
    font-family: inherit;
    font-size: 1.5rem;
    font-weight: 700;
    text-align: center;
    cursor: pointer;
  }
  .mode-btn:active { background: var(--accent-hover); }
  .mode-btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
  .home-title { text-align: center; margin: 0 0 8px; font-size: 1.5rem; font-weight: 700; }
  .home-sub { text-align: center; margin: -4px 0 12px; color: var(--text-muted); font-size: 0.95rem; }

  /* Common screen header */
  .screen-header { display: flex; align-items: center; justify-content: space-between; }
  .back-btn {
    padding: 12px 20px;
    border: none;
    border-radius: 12px;
    background: #334155;
    color: #fff;
    font-family: inherit;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
  }
  .back-btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
  .screen-title { font-size: 1.1rem; font-weight: 700; margin: 0; }

  /* Navigate */
  .field-label { font-weight: 700; font-size: 0.95rem; }
  .input-row { display: flex; gap: 8px; }
  #destination-input {
    flex: 1;
    padding: 14px;
    font-size: 1rem;
    font-family: inherit;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    color: var(--text);
  }
  .mic-btn {
    width: 52px;
    border: none;
    border-radius: 10px;
    background: #334155;
    color: #fff;
    font-size: 1.3rem;
    cursor: pointer;
  }
  .mic-btn.listening { background: #dc2626; }
  .primary-btn {
    padding: 16px;
    border: none;
    border-radius: 12px;
    background: var(--accent);
    color: var(--accent-ink);
    font-family: inherit;
    font-size: 1.05rem;
    font-weight: 700;
    cursor: pointer;
  }
  .primary-btn:disabled { opacity: 0.5; }
  #nav-instruction {
    font-size: 1.15rem;
    text-align: center;
    padding: 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
  }
  #nav-status { font-size: 0.85rem; color: var(--text-muted); text-align: center; }

  /* Camera-based screens */
  .camera-wrap {
    position: relative;
    flex: 1;
    border-radius: 16px;
    overflow: hidden;
    background: #000;
    min-height: 300px;
  }
  .camera-wrap video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .camera-wrap canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .capture-btn {
    align-self: center;
    padding: 18px 40px;
    border: none;
    border-radius: 40px;
    background: var(--accent);
    color: var(--accent-ink);
    font-family: inherit;
    font-size: 1.1rem;
    font-weight: 700;
    cursor: pointer;
  }
  .status-line { text-align: center; font-size: 0.9rem; color: var(--text-muted); min-height: 1.2em; }

  .error-banner {
    background: var(--danger-bg);
    color: var(--danger);
    border-radius: 10px;
    padding: 12px 16px;
    font-size: 0.9rem;
    text-align: center;
  }

  .visually-hidden {
    position: absolute; width: 1px; height: 1px; overflow: hidden;
    clip: rect(0 0 0 0); white-space: nowrap;
  }
</style>
</head>
<body>
<div id="app">

  <!-- HOME -->
  <section id="screen-home" class="screen active" aria-label="Accueil">
    <h1 class="home-title">Access Guide</h1>
    <p class="home-sub">Aide au déplacement et à l'environnement</p>
    <button class="mode-btn" data-nav="navigate" accesskey="1">Naviguer</button>
    <button class="mode-btn" data-nav="obstacles" accesskey="2">Obstacles</button>
    <button class="mode-btn" data-nav="describe" accesskey="3">Décrire</button>
  </section>

  <!-- NAVIGATE -->
  <section id="screen-navigate" class="screen" aria-label="Naviguer">
    <div class="screen-header">
      <button class="back-btn" data-nav="home">Retour</button>
      <p class="screen-title">Naviguer</p>
      <span style="width:84px"></span>
    </div>
    <label class="field-label" for="destination-input">Destination</label>
    <div class="input-row">
      <input id="destination-input" type="text" placeholder="Adresse ou lieu" autocomplete="off" />
      <button class="mic-btn" id="nav-mic-btn" aria-label="Dicter la destination à la voix">🎤</button>
    </div>
    <button class="primary-btn" id="nav-start-btn">Démarrer</button>
    <p id="nav-instruction" role="status" aria-live="polite" style="display:none"></p>
    <p id="nav-status" role="status" aria-live="polite"></p>
  </section>

  <!-- OBSTACLES -->
  <section id="screen-obstacles" class="screen" aria-label="Obstacles">
    <div class="screen-header">
      <button class="back-btn" data-nav="home">Retour</button>
      <p class="screen-title">Obstacles</p>
      <span style="width:84px"></span>
    </div>
    <div class="camera-wrap">
      <video id="obstacles-video" autoplay playsinline muted></video>
      <canvas id="obstacles-canvas"></canvas>
    </div>
    <p class="status-line" id="obstacles-status" role="status" aria-live="polite">Chargement du modèle de détection…</p>
  </section>

  <!-- DESCRIBE -->
  <section id="screen-describe" class="screen" aria-label="Décrire">
    <div class="screen-header">
      <button class="back-btn" data-nav="home">Retour</button>
      <p class="screen-title">Décrire</p>
      <span style="width:84px"></span>
    </div>
    <div class="camera-wrap">
      <video id="describe-video" autoplay playsinline muted></video>
    </div>
    <canvas id="describe-canvas" class="visually-hidden"></canvas>
    <button class="capture-btn" id="describe-capture-btn">Décrire</button>
    <p class="status-line" id="describe-status" role="status" aria-live="polite"></p>
  </section>

</div>

<div id="live-region" class="visually-hidden" role="status" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.20.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.0/dist/tesseract.min.js"></script>
<script src="logic.js"></script>
<script src="app.js"></script>
</body>
</html>
